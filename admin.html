<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Dining | DUET Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#123c2c;color:white;padding:20px}
header h2{margin:0}
main{max-width:1100px;margin:24px auto;padding:0 14px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0000000c}
input,button{padding:11px;border:1px solid #ccd5df;border-radius:7px;font-size:14px;margin:4px 0}
input{width:100%}
button{cursor:pointer;background:#176b4d;color:white;border:0}
.secondary{background:#475569}
.danger{background:#b42318}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#e8f5ee;padding:15px;border-radius:9px}
.stat b{font-size:24px;display:block;margin-top:8px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:13px}
#message{white-space:pre-wrap;color:#b42318}
.small{color:#64748b;font-size:13px}
.actions button{margin:3px}
</style>
</head>

<body>
<header>
  <h2>Smart Dining | DUET</h2>
  <p>Admin Dashboard</p>
</header>

<main>
  <section id="loginCard" class="card">
    <h3>Admin Login</h3>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
    <p id="message"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <b>Smart Dining Management</b><br><br>
      <button id="refreshBtn">Refresh Data</button>
      <button id="logoutBtn" class="secondary">Logout</button>
      <p id="status" class="small"></p>
    </div>

    <div class="grid card">
      <div class="stat">Total Students<b id="totalStudents">0</b></div>
      <div class="stat">Pending<b id="pendingStudents">0</b></div>
      <div class="stat">Approved<b id="approvedStudents">0</b></div>
      <div class="stat">Blocked<b id="blockedStudents">0</b></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button data-tab="students">Students</button>
        <button data-tab="meals">Meals</button>
        <button data-tab="payments">Payments</button>
      </div>

      <section id="studentsTab">
        <h3>Student Management</h3>
        <input id="studentSearch" placeholder="Search student ID, name, email or room">
        <div class="tablewrap">
          <table>
            <thead>
              <tr><th>Student</th><th>Room</th><th>Status</th><th>RFID UID</th><th>Actions</th></tr>
            </thead>
            <tbody id="studentsBody"></tbody>
          </table>
        </div>
      </section>

      <section id="mealsTab" class="hidden">
        <h3>Meal Records</h3>
        <div class="tablewrap">
          <table>
            <thead>
              <tr><th>Student ID</th><th>Date</th><th>Meal</th><th>Status</th><th>Amount</th></tr>
            </thead>
            <tbody id="mealsBody"></tbody>
          </table>
        </div>
      </section>

      <section id="paymentsTab" class="hidden">
        <h3>Payment Records</h3>
        <div class="tablewrap">
          <table>
            <thead>
              <tr><th>Student ID</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr>
            </thead>
            <tbody id="paymentsBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </section>
</main>

<script>
// Supabase configuration — your project URL and Publishable Key
const SUPABASE_URL = "https://wwgzlzrhrcjpxrtyobty.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_O5qjhiHkBqTPCRZjW9VMnQ_f7liBq9j";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function message(text) {
  $("message").textContent = text;
}

function studentStatus(s) {
  if (s.is_blocked) return "Blocked";
  if (s.is_approved === true || s.approval_status === "approved")
    return "Approved";
  if (s.approval_status === "rejected") return "Rejected";
  return "Pending";
}

async function verifyAdmin() {
  const { data: { user }, error } = await db.auth.getUser();
  if (error || !user) return false;

  const { data, error: roleError } = await db.rpc("is_admin");
  if (roleError) throw roleError;

  return data === true;
}

async function login(event) {
  event.preventDefault();
  message("Logging in...");

  const email = $("email").value.trim();
  const password = $("password").value;

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    message("Login failed: " + error.message);
    return;
  }

  try {
    if (!(await verifyAdmin())) {
      await db.auth.signOut();
      message("This account does not have admin permission.");
      return;
    }

    $("loginCard").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    await loadData();
  } catch (error) {
    message("Admin verification failed: " + error.message);
  }
}

let students = [];

async function loadData() {
  $("status").textContent = "Loading data...";

  const results = await Promise.all([
    db.from("students").select("*").order("created_at", {ascending:false}),
    db.from("student_meals").select("*").order("meal_date", {ascending:false}).limit(500),
    db.from("payments").select("*").order("created_at", {ascending:false}).limit(500)
  ]);

  const errors = results.filter(r => r.error);
  if (errors.length) {
    $("status").textContent = "Database error: " +
      errors.map(r => r.error.message).join(" | ");
    return;
  }

  students = results[0].data || [];
  const meals = results[1].data || [];
  const payments = results[2].data || [];

  $("totalStudents").textContent = students.length;
  $("pendingStudents").textContent =
    students.filter(s => studentStatus(s) === "Pending").length;
  $("approvedStudents").textContent =
    students.filter(s => studentStatus(s) === "Approved").length;
  $("blockedStudents").textContent =
    students.filter(s => s.is_blocked).length;

  renderStudents();
  $("mealsBody").innerHTML = meals.map(m => `
    <tr>
      <td>${esc(m.student_id)}</td>
      <td>${esc(m.meal_date)}</td>
      <td>${esc(m.meal_type)}</td>
      <td>${esc(m.status)}</td>
      <td>৳${esc(m.amount)}</td>
    </tr>`).join("");

  $("paymentsBody").innerHTML = payments.map(p => `
    <tr>
      <td>${esc(p.student_id)}</td>
      <td>৳${esc(p.amount)}</td>
      <td>${esc(p.method)}</td>
      <td>${esc(p.payment_status)}</td>
      <td>${esc(p.created_at)}</td>
    </tr>`).join("");

  $("status").textContent =
    `Loaded ${students.length} students, ${meals.length} meal records and ${payments.length} payments.`;
}

function renderStudents() {
  const q = $("studentSearch").value.trim().toLowerCase();

  const filtered = students.filter(s =>
    [s.student_id, s.name, s.email, s.room_no]
      .some(v => String(v ?? "").toLowerCase().includes(q))
  );

  $("studentsBody").innerHTML = filtered.map(s => `
    <tr>
      <td>
        <b>${esc(s.name)}</b><br>
        ID: ${esc(s.student_id)}<br>
        <span class="small">${esc(s.email)}</span>
      </td>
      <td>${esc(s.room_no)}</td>
      <td>${esc(studentStatus(s))}</td>
      <td>${esc(s.rfid_uid)}</td>
      <td class="actions">
        <button onclick="approveStudent('${esc(s.id)}')">Approve</button>
        <button class="secondary" onclick="toggleBlock('${esc(s.id)}',${!s.is_blocked})">
          ${s.is_blocked ? "Unblock" : "Block"}
        </button>
        <button class="secondary" onclick="setRFID('${esc(s.id)}')">Set RFID</button>
      </td>
    </tr>`).join("");
}

async function approveStudent(id) {
  if (!confirm("Approve this student?")) return;

  const { error } = await db.from("students").update({
    is_approved: true,
    approval_status: "approved"
  }).eq("id", id);

  if (error) return alert("Approve failed: " + error.message);
  await loadData();
}

async function toggleBlock(id, blocked) {
  if (!confirm(blocked ? "Block this student?" : "Unblock this student?"))
    return;

  const { error } = await db.from("students")
    .update({is_blocked: blocked}).eq("id", id);

  if (error) return alert("Update failed: " + error.message);
  await loadData();
}

async function setRFID(id) {
  const uid = prompt("Enter the student's RFID UID:");
  if (uid === null) return;

  const { error } = await db.from("students").update({
    rfid_uid: uid.trim(),
    card_status: uid.trim() ? "registered" : "pending"
  }).eq("id", id);

  if (error) return alert("RFID update failed: " + error.message);
  await loadData();
}

$("loginForm").addEventListener("submit", login);
$("refreshBtn").addEventListener("click", loadData);
$("studentSearch").addEventListener("input", renderStudents);

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  $("dashboard").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
  $("password").value = "";
  message("Logged out.");
});

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => {
    ["students", "meals", "payments"].forEach(tab => {
      $(tab + "Tab").classList.toggle("hidden", tab !== button.dataset.tab);
    });
  });
});

// Restore the dashboard only if an existing session belongs to an admin.
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;

  try {
    if (await verifyAdmin()) {
      $("loginCard").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      await loadData();
    }
  } catch (error) {
    console.error(error);
  }
})();
</script>
</body>
</html>
